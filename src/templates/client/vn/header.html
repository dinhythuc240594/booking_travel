{% if request.path.startswith('/en') %}
    {% set index_url = url_for('client.en_index') %}
    {% set search_url = url_for('client.en_search') %}
{% else %}
    {% set index_url = url_for('client.index') %}
    {% set search_url = url_for('client.search') %}
{% endif %}
<div class="container">
    <div class="row align-items-center">
        <div class="col-md-2">
            <div class="logo">
                <h1><a href="{{ index_url }}">VnBookingTravel</a></h1>
            </div>
        </div>
        <div class="col-md-5">
            <form action="{{ search_url }}" method="GET" class="search-box">
                <input type="text" name="q" class="form-control" placeholder="Tìm kiếm chuyến du lịch..." value="{{ request.args.get('q', '') }}">
                <button type="submit" class="btn-search"><i class="fas fa-search"></i></button>
            </form>
        </div>
    </div>
</div>
