<div class="container">
    <div class="row align-items-center">
        <div class="col-md-2">
            <div class="logo">
                <h1><a href="{{ url_for('client.home') }}">VnBookingTravel</a></h1>
            </div>
        </div>
        <div class="col-md-5">
            <form action="{{ url_for('client.search') }}" method="GET" class="search-box">
                <input type="text" name="q" class="form-control" placeholder="Tìm kiếm chuyến du lịch..." value="{{ request.args.get('q', '') }}">
                <button type="submit" class="btn-search"><i class="fas fa-search"></i></button>
            </form>
        </div>
    </div>
</div>
